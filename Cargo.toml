[package]
name = "crosshair-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Dexytf3"]
description = "A minimal native crosshair overlay for Linux, built with Rust and GTK4. Fork of Dilates Crosshair."
repository = "https://github.com/DexytF3"
homepage = "https://github.com/DexytF3"
readme = "README.md"
keywords = ["crosshair", "overlay", "gaming", "gtk4", "linux"]
categories = ["games"]

[dependencies]
anyhow = "1"
async-channel = "2"
futures-util = "0.3"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_10"] }
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
tiny-skia = "0.12"
toml = "0.9"
tokio = { version = "1", features = ["rt", "sync", "time"] }
ashpd = { version = "0.14", default-features = false, features = ["global_shortcuts", "tokio"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["randr", "shape"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
